
<header class="masthead">
  <div class="wrap masthead__inner">
    <a class="brand" href="index.html" aria-label="Junior's Chimney — home">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs><linearGradient id="bg1" x1="32" y1="58" x2="32" y2="18" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#D92E1B"/><stop offset=".45" stop-color="#FF6B1A"/><stop offset="1" stop-color="#FFC46B"/>
        </linearGradient></defs>
        <path d="M8 17.5 13.5 9.5h37L56 17.5Z" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M12.5 17.5v37h39v-37" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M12.5 31h39M12.5 43h39" stroke="currentColor" stroke-width="2" opacity=".38"/>
        <path d="M32 46.6c-4.6 0-7.6-3.1-7.6-7 0-3.6 2.4-5.9 4-8.5 1.2-2 1.7-4 1.4-6.1 3 1.3 5 3.5 6 6 1-1.3 1.4-2.7 1.3-4.3 2.5 2.6 4.5 6.3 4.5 10.4 0 5-3.4 9.5-9.6 9.5Z" fill="url(#bg1)"/>
      </svg>
      <span class="brand__type">
        <span class="brand__name">Junior&rsquo;s Chimney</span>
        <span class="brand__sub">Est. Bucks County</span>
      </span>
    </a>

    <nav class="nav" aria-label="Primary">
          {{NAV}}
    </nav>

    <div class="masthead__cta">
      <a class="phone-link" href="tel:{{PHONE_HREF}}" aria-label="Call {{PHONE}}">
        <span class="pulse" aria-hidden="true"></span>
        <svg class="phone-link__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.5 3h3l1.5 4-2 1.4a12 12 0 0 0 5.6 5.6L16 12l4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 3.5 5.2 2 2 0 0 1 5.5 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span class="phone-link__num">{{PHONE}}</span>
      </a>
      <a class="btn" href="contact.html">
        Book an inspection
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h12M9 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="burger" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="drawer" id="drawer">
  <div class="wrap">
    <nav aria-label="Mobile">
          {{NAV_MOBILE}}
    </nav>
    <div class="drawer__foot">
      <a class="btn" href="tel:{{PHONE_HREF}}">Call {{PHONE}}</a>
      <p class="muted" style="font-size:.82rem">{{HOURS}}</p>
    </div>
  </div>
</div>

<main id="main">
